<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capital One Case Prep</title><style>
:root{--ink:#172c3d;--muted:#596b78;--line:#dbe3e7;--paper:#f4f6f7;--accent:#126567;--good:#176747;--bad:#a33333}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif}header{background:white;border-bottom:1px solid var(--line);padding:22px max(28px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;gap:20px;align-items:center}header strong{font-size:20px}small,.muted{color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap}main{max-width:1180px;margin:36px auto;padding:0 24px 60px}h1{font-size:34px;letter-spacing:-1px;line-height:1.2;margin:10px 0 16px}h2{font-size:22px;line-height:1.3}h3{font-size:17px}.eyebrow{text-transform:uppercase;letter-spacing:1.6px;font-size:12px;font-weight:700;color:var(--accent)}button{font:inherit;font-weight:600;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:11px 17px;cursor:pointer}button:hover{border-color:var(--accent);background:#f0f7f6}button:disabled{opacity:.5;cursor:default}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#0d5153;color:white}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #c68526;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:25px;margin-bottom:18px}.grid .card{margin:0}.wide{grid-column:span 2}.hero{display:flex;justify-content:space-between;gap:30px;align-items:center;margin-bottom:26px}.hero p{max-width:700px}.pill{font-size:12px;border:1px solid var(--line);border-radius:30px;padding:5px 10px;display:inline-block}.stats{display:flex;gap:30px;flex-wrap:wrap;margin:24px 0}.stats b{font-size:27px;display:block}.stats span{font-size:13px;color:var(--muted)}.bar{height:7px;border-radius:6px;background:#e9eef0;overflow:hidden;margin:7px 0 14px}.bar i{display:block;height:100%;background:var(--accent)}.metric{display:flex;justify-content:space-between;font-size:13px;gap:15px}.workspace{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px}.sidebar button{display:block;width:100%;text-align:left;margin:7px 0;font-size:14px}.sidebar .active{border-color:var(--accent);background:#e6f1ef}.question{max-width:820px}.scenario{font-size:19px;line-height:1.65;margin:18px 0 26px}.options{display:grid;gap:10px;margin:15px 0 22px}.option{display:flex;align-items:flex-start;gap:12px;padding:14px;border:1px solid var(--line);border-radius:7px;cursor:pointer}.option:has(input:checked){background:#edf6f4;border-color:var(--accent)}input[type=radio],input[type=checkbox]{accent-color:var(--accent);margin-top:6px}input[type=text],textarea{font:inherit;width:100%;padding:12px;border:1px solid #aebdc5;border-radius:6px;color:var(--ink);background:white}textarea{min-height:110px;resize:vertical}label.field{display:block;margin:14px 0}.feedback{padding:18px;border-left:4px solid var(--accent);background:#edf6f4;margin:20px 0}.feedback.bad{border-color:var(--bad);background:#fff2ef}.feedback p{margin:7px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.divider{border-top:1px solid var(--line);margin:24px 0}.error{color:var(--bad);font-weight:600}details{border-top:1px solid var(--line);padding:15px 0}summary{cursor:pointer;font-weight:600}.checks label{display:block;margin:8px 0}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:20px}ol,ul{padding-left:23px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}.notice{background:#fff6e7;padding:12px 18px;border-radius:6px;margin-bottom:18px}.empty{padding:30px;text-align:center}.step{font-size:13px;color:var(--muted)}footer{margin-top:32px;font-size:12px;color:var(--muted)}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.sidebar{display:flex;flex-wrap:wrap;gap:5px}.sidebar button{width:auto}.hero{display:block}header{display:block}nav{margin-top:15px}}@media(max-width:560px){.grid,.comparison{grid-template-columns:1fr}.wide{grid-column:auto}main{padding:0 14px}.card{padding:19px}h1{font-size:28px}}
</style></head><body><header><div><strong>Capital One Case Prep</strong><br><small>Foundation Practice · October 7–11, 2026</small></div><nav aria-label="Main navigation"><button data-act="dashboard">Dashboard</button><button data-act="progress">Overall progress</button><button data-act="mistakes">Mistake review</button></nav></header><main id="app"></main><script>
'use strict';
const DAYS=['Profitability Foundations','Customer Acquisition & Percentages','Weighted Averages & Pricing','Market Expansion & Investment','Mixed Review'];
const SKILLS=['Equation Recognition','Math Setup','Arithmetic','Business Interpretation','Structuring','Synthesis'];
const SECTIONS=['Equation Recognition','Business Math','Issue Trees','Mini-Case','Mistake Review'];
// Content uses annual, undiscounted benefits unless a question explicitly specifies otherwise.
const C={
 revenue:['Revenue','Volume × Price','Multiply units sold by revenue per unit.','Sales dollars before costs.',['Volume ÷ Price','Price − Volume','Fixed costs ÷ Price']],
 profit:['Profit','Revenue − Variable costs − Fixed costs','Subtract every relevant cost from revenue.','The question asks what remains after all costs.',['Revenue − Fixed costs','Revenue + Costs','Revenue ÷ Costs']],
 contribution:['Contribution per unit','Revenue per unit − Variable cost per unit','Each unit contributes toward fixed costs and then profit.','Per-unit economics before fixed costs.',['Revenue per unit − Total fixed costs','Revenue per unit ÷ Variable cost per unit','Revenue per unit + Variable cost per unit']],
 breakeven:['Breakeven volume','Fixed costs ÷ Contribution per unit','Each unit covers one unit of contribution toward the fixed bill.','How much scale covers the fixed cost?',['Fixed costs ÷ Revenue per unit','Contribution per unit ÷ Fixed costs','Fixed costs × Contribution per unit']],
 conversion:['Conversion rate','Customers acquired ÷ Prospects','Use the starting pool as the denominator.','A share of the original audience takes action.',['Prospects ÷ Customers acquired','Customers acquired ÷ Marketing spend','Customers acquired − Prospects']],
 cac:['Customer acquisition cost','Marketing spend ÷ Customers acquired','Spread acquisition spending over actual new customers.','Cost to win one paying customer.',['Marketing spend ÷ Prospects','Customers acquired ÷ Marketing spend','Revenue ÷ Customers acquired']],
 change:['Percent change','(New − Old) ÷ Old','Measure the change relative to the starting value.','Compared with the original value.',['(New − Old) ÷ New','New ÷ Old','Old − New']],
 weighted:['Weighted average','Sum of (Segment share × Segment value)','Different-sized segments must receive different weights.','Unequal customer or product mix.',['Sum of segment values ÷ Number of segments','Largest value − Smallest value','Sum of segment shares ÷ Sum of values']],
 roi:['Simple net ROI','Net benefit over stated period ÷ Initial investment','Use the stated period and net benefit after the initial investment.','Return relative to dollars committed; clarify the period.',['Initial investment ÷ Net benefit','Gross benefit ÷ Initial investment','Net benefit + Initial investment']],
 payback:['Simple payback','Initial investment ÷ Annual net cash benefit','Count years needed to recover the upfront outlay.','How long until the investment is recovered?',['Annual net cash benefit ÷ Initial investment','Initial investment × Annual net cash benefit','Initial investment − Annual net cash benefit']],
 probability:['Probability / expected value','Sum of (Outcome probability × Outcome value)','Weight each mutually exclusive outcome by its probability.','Uncertain outcomes with stated likelihoods.',['Sum of outcome values ÷ Number of outcomes','Largest outcome × Smallest probability','Sum of probabilities ÷ Sum of values']],
 market:['Market sizing','Population × Relevant segment share × Adoption rate','Filter the population in stages without double-counting.','Start with the market, then narrow to likely users.',['Population ÷ Adoption rate','Population × (Segment share + Adoption rate)','Population ÷ Segment share']],
 share:['Market share','Company sales ÷ Total market sales','Compare like-for-like sales in the same market and period.','Company activity as a fraction of the whole market.',['Total market sales ÷ Company sales','Company sales ÷ Competitor count','Company sales − Total market sales']],
 units:['Unit conversion','Starting quantity × Conversion factor','Align the time period and units before comparing.','Monthly versus annual, or thousands versus millions.',['Starting quantity ÷ Starting quantity','Starting quantity + Conversion factor','Starting quantity − Conversion factor']],
 funnel:['Customer funnel','Prospects × Response rate × Purchase rate among responders','Apply each rate to its own stage of the funnel.','Only a subset of responders become purchasers.',['Prospects × (Response rate + Purchase rate)','Prospects × Purchase rate only','Prospects ÷ Response rate']],
 pricing:['Price-volume economics','Volume × (Price − Variable cost per unit) − Fixed costs','A price change affects unit contribution and possibly volume.','Higher price does not automatically mean higher profit.',['Volume × Price','Volume × (Price + Variable cost)','Price − Fixed costs']],
 acquisition:['Acquisition economics','Customers × (Contribution per customer − CAC)','Deduct acquisition cost once for each new customer in the stated period.','Compare customer contribution with the cost of winning them.',['Customers × Contribution per customer','Customers × (Contribution per customer + CAC)','Contribution per customer ÷ Customers']]
};
const bank=[[],[],[],[],[]];
function add(d,c,text,setup,expr,unit,meaning,common,first){const q={id:'d'+d+'q'+bank[d-1].length,day:d,c,text,setup,expr,answer:Function('return ('+expr+')')(),unit,meaning,common:common||C[c][2],first:first||setup,trigger:C[c][3]};bank[d-1].push(q);return q;}

add(1,'revenue','A budgeting app has 8,000 paying users at $5 per month. What is monthly subscription revenue?','8,000 × 5','8000*5','$/month','This is $40,000 of monthly sales before hosting, support and fixed costs. Assess those costs before judging profitability.');
add(1,'profit','A retailer earns $900,000 annually, spends $540,000 on goods and $210,000 on rent and salaries. What is annual profit?','900,000 − 540,000 − 210,000','900000-540000-210000','$/year','The store retains $150,000 after these costs. Compare it with invested capital and alternatives.');
add(1,'contribution','A card account produces $120 annual revenue and $45 in annual variable servicing costs. How much does one account contribute before fixed costs?','120 − 45','120-45','$/account/year','Each account provides $75 toward shared fixed costs and then profit. Account count still matters.');
add(1,'breakeven','A service has $600,000 annual fixed costs and $30 annual contribution per customer. How many customers cover its annual operating bill?','600,000 ÷ 30','600000/30','customers','At 20,000 customers annual contribution covers fixed costs. Validate whether that scale is attainable.');
add(1,'units','A help desk spends $18,000 each month. What is the comparable annual expense?','18,000 × 12','18000*12','$/year','Annual expense is $216,000. Use that period when comparing against annual revenue.');
add(1,'profit','A digital course sells 5,000 seats for $40 each. Delivery costs $10 per seat and annual fixed costs are $90,000. What is annual profit?','5,000 × (40 − 10) − 90,000','5000*(40-10)-90000','$/year','The course earns $60,000 after fixed costs. Contribution alone would overstate profit.');
add(1,'contribution','A magazine collects $24 per subscriber annually plus $1 of ad revenue for each of 12 issues. Printing costs $2 per issue. Find annual contribution per subscriber.','24 + 12 × 1 − 12 × 2','24+12-24','$/subscriber/year','Each subscriber contributes $12 toward content and other fixed costs. Include both revenue streams.');
add(1,'breakeven','A repair kiosk requires $72,000 of annual fixed expense. Customers pay $50 per repair and parts cost $20. How many repairs cover the annual expense?','72,000 ÷ (50 − 20)','72000/(50-20)','repairs/year','The kiosk needs 2,400 repairs a year. Compare with realistic demand and capacity.');
add(1,'revenue','A shop earns $12 per online order on 3,000 orders and $20 per in-store order on 2,000 orders. What are total sales?','3,000 × 12 + 2,000 × 20','3000*12+2000*20','$','Combined revenue is $76,000; channel costs are needed to compare profitability.');
add(1,'profit','A support team reduces annual fixed staffing cost from $400,000 to $340,000 with no effect on sales or service costs. How much does annual profit improve?','400,000 − 340,000','400000-340000','$/year','Profit rises $60,000 if revenue and service quality hold. Validate the no-impact assumption.');
add(1,'pricing','A gym sells 2,000 annual memberships at $300. Variable costs are $100 per member and fixed costs are $250,000. What is annual operating profit?','2,000 × (300 − 100) − 250,000','2000*(300-100)-250000','$/year','Annual profit is $150,000; fixed costs are paid once, not per member.');
add(1,'breakeven','A software service needs $100,000 annual profit in addition to covering $200,000 fixed costs. Contribution is $50 per client. How many clients are required?','(200,000 + 100,000) ÷ 50','(200000+100000)/50','clients','It needs 6,000 clients for the target profit, above the scale required just to break even.','Include target profit alongside fixed costs.');
add(1,'contribution','A delivery order yields $18 revenue, with $8 driver pay and $4 packaging and payment fees. What remains per order before fixed costs?','18 − 8 − 4','18-8-4','$/order','Each order contributes $6. Additional orders help only if these variable costs stay stable.');
add(1,'profit','A lender has $1.2 million annual revenue, $300,000 funding costs, $200,000 expected credit losses and $400,000 operating costs. Find annual profit.','1,200,000 − 300,000 − 200,000 − 400,000','1200000-300000-200000-400000','$/year','Profit is $300,000 after funding, expected losses and operations. Revenue alone hides major costs.');
add(1,'units','A processing team handles 2,000 transactions per day on 250 operating days. What is annual volume?','2,000 × 250','2000*250','transactions/year','Annual volume is 500,000 transactions; use operating days rather than calendar days.');
add(2,'conversion','A campaign reaches 40,000 prospects and wins 2,000 customers. What percentage converts?','2,000 ÷ 40,000 × 100','2000/40000*100','%','Five percent convert. Compare with acquisition cost and customer quality before scaling.');
add(2,'cac','A lender spends $90,000 on a campaign that wins 3,000 new accounts. What is acquisition cost per account?','90,000 ÷ 3,000','90000/3000','$/account','Each account costs $30 to acquire. Compare with contribution over an explicit time horizon.');
add(2,'funnel','An offer reaches 100,000 people; 8% respond and 25% of responders buy. How many purchase?','100,000 × 0.08 × 0.25','100000*.08*.25','customers','There are 2,000 buyers, a 2% overall conversion rate. Campaign spend determines CAC.');
add(2,'change','A landing page improves from 4% conversion to 5%. What is the relative percent increase, not the percentage-point change?','(5 − 4) ÷ 4 × 100','(5-4)/4*100','%','Conversion improves 25% relatively, or 1 percentage point. Keep those measures distinct.');
add(2,'acquisition','A campaign acquires 2,000 users. Each generates $60 first-year contribution and costs $35 to acquire. Find total first-year contribution after acquisition, before fixed costs.','2,000 × (60 − 35)','2000*(60-35)','$','The cohort contributes $50,000 after acquisition, before fixed costs. This alone is not total company profit.');
add(2,'cac','Mail costs $0.60 per prospect and 3% become paid subscribers. Find cost per paid subscriber.','0.60 ÷ 0.03','.6/.03','$/subscriber','CAC is $20. The denominator must be paid conversion, not just expressions of interest.');
add(2,'change','Cost per account falls from $50 to $40. What is the percent change? Enter a negative value for a decline.','(40 − 50) ÷ 50 × 100','(40-50)/50*100','%','CAC decreases 20%, improving acquisition economics if account quality is unchanged.');
add(2,'revenue','An email reaches 20,000 people; 10% buy a $30 product. What revenue does it generate?','20,000 × 0.10 × 30','20000*.1*30','$','Revenue is $60,000 before product and marketing costs. Conversion is only part of campaign economics.');
add(2,'conversion','Of 12,000 loan applicants, 9,000 are approved. What percentage is approved?','9,000 ÷ 12,000 × 100','9000/12000*100','%','Approval is 75% of applicants. It says nothing yet about funded loans.');
add(2,'funnel','A bank gets 10,000 applications, approves 80%, and 50% of approved applicants accept. How many funded accounts result?','10,000 × 0.80 × 0.50','10000*.8*.5','accounts','There are 4,000 funded accounts. Diagnose both approval and acceptance to grow volume.');
add(2,'breakeven','A campaign has $60,000 fixed creative cost. Each customer yields $70 annual contribution and costs $40 to acquire. How many new customers cover creative cost in year one?','60,000 ÷ (70 − 40)','60000/(70-40)','customers','It takes 2,000 customers to cover creative expense after acquisition costs.');
add(2,'weighted','Channel A acquires 1,000 users at $20 CAC; channel B acquires 3,000 at $40 CAC. Find blended CAC.','(1,000 × 20 + 3,000 × 40) ÷ 4,000','(1000*20+3000*40)/4000','$/customer','Blended CAC is $35, weighted by acquired users. A simple average would understate spend per user.');
add(2,'probability','A customer renews with 80% probability. A renewal contributes $50; nonrenewal contributes $0. Find expected renewal contribution per current customer.','0.80 × 50 + 0.20 × 0','.8*50','$/customer','Expected renewal contribution is $40 per current customer, not a guaranteed $40 for every individual.');
add(2,'profit','A campaign produces $180,000 contribution before marketing. Media costs $100,000 and creative costs $30,000. Find profit after these costs.','180,000 − 100,000 − 30,000','180000-100000-30000','$','The campaign leaves $50,000 after listed costs. Check for other incremental costs before approval.');
add(2,'units','An acquisition budget is $0.24 million and CAC is $40. How many accounts can it fund?','0.24 × 1,000,000 ÷ 40','.24*1000000/40','accounts','The budget funds 6,000 accounts at that CAC. Convert millions before dividing.');
add(3,'weighted','A card portfolio is 75% basic accounts contributing $20 a year and 25% premium contributing $60. Find average annual contribution.','0.75 × 20 + 0.25 × 60','.75*20+.25*60','$/account/year','The average is $30 because most accounts are basic. Portfolio mix drives economics.');
add(3,'pricing','A shop raises price to $25, expects 8,000 sales, and pays $10 variable cost per sale with $60,000 fixed cost. Find projected profit.','8,000 × (25 − 10) − 60,000','8000*(25-10)-60000','$','Projected profit is $60,000. Compare against current profit and validate demand at the new price.');
add(3,'probability','A pilot has a 60% chance of $100,000 profit and a 40% chance of a $50,000 loss. What is expected profit?','0.60 × 100,000 + 0.40 × (−50,000)','.6*100000+.4*(-50000)','$','Expected profit is $40,000 but the downside still matters. An average is not a guaranteed outcome.');
add(3,'weighted','A support queue has 300 simple calls taking 4 minutes and 100 complex calls taking 12 minutes. Find average handling time.','(300 × 4 + 100 × 12) ÷ 400','(300*4+100*12)/400','minutes/call','Average time is 6 minutes. Treating call types equally would overstate the staffing burden.');
add(3,'change','A subscription price rises from $20 to $25 monthly. Find the percent price increase.','(25 − 20) ÷ 20 × 100','(25-20)/20*100','%','The price rises 25%; profitability also depends on retention and service costs.');
add(3,'revenue','A product previously sold 10,000 units at $20. At a new $25 price, sales fall to 8,000 units. What is new revenue?','25 × 8,000','25*8000','$','Revenue stays $200,000. Lower volume can still improve contribution if variable costs fall.');
add(3,'contribution','A premium account earns $150 fees and $50 other annual revenue. Rewards cost $60 and service costs $40. Find contribution per account.','150 + 50 − 60 − 40','150+50-60-40','$/account/year','The premium account contributes $100 before fixed costs and acquisition.');
add(3,'breakeven','A product currently produces $120,000 total contribution. A proposed price yields $15 contribution per sale. How many sales preserve current total contribution?','120,000 ÷ 15','120000/15','sales','At 8,000 sales the new price preserves contribution. Demand below that threshold makes the change worse.');
add(3,'weighted','A store sells 60% standard items at $30 and 40% deluxe at $50. What is average selling price?','0.60 × 30 + 0.40 × 50','.6*30+.4*50','$/item','Average price is $38. A shift toward deluxe increases revenue per sale, but costs may also increase.');
add(3,'probability','A payment succeeds initially with 90% probability. Of failed attempts, half succeed on one retry. What percentage ultimately succeeds?','(0.90 + 0.10 × 0.50) × 100','(.9+.1*.5)*100','%','Overall success is 95%. Apply retry success only to the failed subset.');
add(3,'profit','A price increase adds $40,000 revenue but increases support expense by $10,000 and loses $15,000 contribution from cancelled accounts. What is incremental profit?','40,000 − 10,000 − 15,000','40000-10000-15000','$','Incremental profit is $15,000 after both service and cancellation effects.');
add(3,'weighted','Half of borrowers take $1,000, 30% take $2,000 and 20% take $5,000. What is average loan size?','0.50 × 1,000 + 0.30 × 2,000 + 0.20 × 5,000','.5*1000+.3*2000+.2*5000','$/loan','Average loan size is $2,100. Funding needs depend on this mix, not the unweighted average.');
add(3,'probability','A warranty costs $200 when claimed, and 5% of buyers claim once. What expected warranty cost should be allocated per sale?','0.05 × 200','.05*200','$/sale','Expected warranty cost is $10 per sale. Include it in unit economics across the portfolio.');
add(3,'pricing','A cafe sells 1,000 meals at $12 with $6 variable cost. A $10 promotion brings 1,800 meals with the same unit cost. How much does total contribution change?','1,800 × (10 − 6) − 1,000 × (12 − 6)','1800*(10-6)-1000*(12-6)','$','Contribution improves $1,200 before any extra fixed staffing or promotion cost.');
add(3,'units','A platform charges $0.02 per transaction and handles 3 million transactions per month. Find monthly fee revenue.','0.02 × 3,000,000','.02*3000000','$/month','Monthly revenue is $60,000; confusing cents with dollars would overstate it by 100 times.');
add(4,'market','A city has 1 million adults. 20% are target customers and 10% of that segment is expected to adopt. Estimate customers.','1,000,000 × 0.20 × 0.10','1000000*.2*.1','customers','Expected adoption is 20,000 customers, not the entire target segment. Validate both assumptions.');
add(4,'share','A company sells $15 million annually in a $300 million market. What is its market share by revenue?','15 ÷ 300 × 100','15/300*100','%','Revenue share is 5%. Use the same period and market definition for numerator and denominator.');
add(4,'payback','An automation tool costs $240,000 upfront and saves $80,000 net cash annually. What is simple payback?','240,000 ÷ 80,000','240000/80000','years','Simple payback is 3 years, ignoring discounting. Check useful life and confidence in savings.');
add(4,'roi','A one-year pilot costs $100,000 upfront and returns $140,000 cash at year end, with no other costs. Find net ROI over the year.','(140,000 − 100,000) ÷ 100,000 × 100','(140000-100000)/100000*100','%','One-year net ROI is 40%. Gross receipts divided by investment would be 140%, a different metric.');
add(4,'revenue','An expansion attracts 12,000 accounts paying $10 monthly. Find annual fee revenue.','12,000 × 10 × 12','12000*10*12','$/year','Annual revenue is $1.44 million before operating and acquisition costs.');
add(4,'profit','An expansion has 20,000 customers at $40 annual contribution and $500,000 annual fixed cost. Find annual operating profit.','20,000 × 40 − 500,000','20000*40-500000','$/year','Operating profit is $300,000 before any upfront investment. Distinguish recurring profit from launch cash flow.');
add(4,'breakeven','A branch has $360,000 annual fixed cost and $90 contribution per active account. How many accounts cover fixed cost?','360,000 ÷ 90','360000/90','accounts','The branch requires 4,000 active accounts. Compare with local demand and acquisition capacity.');
add(4,'market','There are 50,000 small firms, 40% need invoicing tools, and 15% of those would adopt. Estimate paying firms.','50,000 × 0.40 × 0.15','50000*.4*.15','firms','Expected adoption is 3,000 firms. Research need and willingness to pay separately.');
add(4,'payback','A system costs $300,000 upfront. It saves $150,000 annually but requires $50,000 annual maintenance. Find simple payback.','300,000 ÷ (150,000 − 50,000)','300000/(150000-50000)','years','Net annual savings are $100,000, giving 3-year payback. Maintenance cannot be ignored.');
add(4,'roi','A project costs $200,000 initially and produces $90,000 net operating cash each year for three years, with no salvage value. Find three-year net ROI.','(3 × 90,000 − 200,000) ÷ 200,000 × 100','(3*90000-200000)/200000*100','%','Three-year undiscounted net ROI is 35%, not an annual return. Timing and risk remain relevant.');
add(4,'share','A service has 8,000 users out of 80,000 eligible users. What percentage of its eligible market has adopted?','8,000 ÷ 80,000 × 100','8000/80000*100','%','Penetration is 10% of eligible users. Do not use the entire population if eligibility narrows the market.');
add(4,'probability','A new region has a 75% chance of $200,000 operating profit and a 25% chance of zero. Find expected operating profit before launch costs.','0.75 × 200,000 + 0.25 × 0','.75*200000','$','Expected operating profit is $150,000 before launch costs. Account for downside and investment separately.');
add(4,'contribution','An expanded delivery zone produces $16 per order and costs $7 delivery plus $3 processing per order. Find contribution per order.','16 − 7 − 3','16-7-3','$/order','Each order contributes $6 toward the expansion overhead and launch investment.');
add(4,'units','A market report lists annual sales of 2,500 in thousands of dollars. Express the market in millions of dollars.','2,500 ÷ 1,000','2500/1000','million dollars','The market is $2.5 million. Align scale before estimating market share or revenue opportunity.');
add(4,'profit','An expansion earns $400,000 contribution but cannibalizes $80,000 of existing contribution and adds $120,000 fixed costs. What is incremental annual profit?','400,000 − 80,000 − 120,000','400000-80000-120000','$/year','Incremental profit is $200,000 after cannibalization. New-product sales are not all incremental value.');
add(5,'breakeven','A business spends $150,000 annually to maintain a service. Each account brings $50 revenue and costs $20 to serve. How many accounts cover the bill?','150,000 ÷ (50 − 20)','150000/(50-20)','accounts','It takes 5,000 accounts to cover fixed costs. Revenue per account is not the amount available to cover them.');
add(5,'cac','A $48,000 campaign reaches 80,000 people; 6% respond and half of responders subscribe. What is spending per new subscriber?','48,000 ÷ (80,000 × 0.06 × 0.50)','48000/(80000*.06*.5)','$/subscriber','CAC is $20 across 2,400 subscribers. Both funnel stages determine acquisition efficiency.');
add(5,'weighted','A bank has 80% accounts producing $30 annual contribution and 20% producing $80. Find portfolio contribution per account.','0.80 × 30 + 0.20 × 80','.8*30+.2*80','$/account/year','Average contribution is $40. The larger basic segment dominates the portfolio economics.');

const KEY='capital-one-foundations-v1';
let storageOK=true;let state;
function fresh(){return {version:1,runs:[],active:null,events:[],mistakes:[],view:'dashboard',practice:null};}
try{state=JSON.parse(localStorage.getItem(KEY)||'null')||fresh();if(state.version!==1||!Array.isArray(state.runs))state=fresh();}catch(e){state=fresh();storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}}
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function fmt(n){return Number.isInteger(n)?n.toLocaleString('en-US'):n.toLocaleString('en-US',{maximumFractionDigits:2});}
function score(events,skill){const e=events.filter(e=>!skill||e.skill===skill);return e.length?Math.round(e.reduce((a,b)=>a+b.value,0)/e.length*100):null;}
function label(n){return n===null?'Not assessed':n>=85?'Strong':n>=70?'Developing':'Priority Area';}
function display(n){return n===null?'—':n+'%';}
function metric(name,n){return `<div class="metric"><span>${esc(name)}</span><span>${display(n)} · ${label(n)}</span></div><div class="bar"><i style="width:${n||0}%"></i></div>`;}
function run(){return state.runs.find(r=>r.id===state.active);}
function current(){return state.practice||run();}
function records(r){return state.events.filter(e=>e.run===r.id);}
function objective(e){return e.filter(x=>!x.self);}
function qkey(q){return q.kind+':'+q.id;}
function resolve(ref){if(ref.kind==='tree'){const t=trees[ref.day-1][ref.index];return {...ref,text:t[1],type:t[0],model:t[2],c:'structure'};}if(ref.kind==='case'){return {...cases[ref.day-1].steps[ref.index],id:ref.id,day:ref.day,case:true,index:ref.index};}if(ref.kind==='recognition')return recognition[ref.day-1].find(q=>q.id===ref.id);return {...bank[ref.day-1].find(q=>q.id===ref.id),kind:'math'};}
function refs(day,kind){return (kind==='recognition'?recognition[day-1]:bank[day-1]).map(q=>({kind,day,id:q.id}));}
function stashPractice(){if(state.practice){state.practices=state.practices||[];state.practices.push(state.practice);state.practice=null;}}
function makeRun(day){stashPractice();let prev=state.runs.filter(r=>r.day===day).at(-1);const choose=(kind)=>{let pool=refs(day,kind),recent=prev?prev.sections[kind==='recognition'?0:1].map(x=>x.id):[];return [...shuffle(pool.filter(x=>!recent.includes(x.id))),...shuffle(pool.filter(x=>recent.includes(x.id)))].slice(0,8);};let ts=trees[day-1].map((t,i)=>({kind:'tree',day,index:i,id:'d'+day+'t'+i}));let broad=shuffle(ts.filter(t=>trees[day-1][t.index][0]==='broad'))[0],driver=shuffle(ts.filter(t=>trees[day-1][t.index][0]==='driver'))[0];let r={id:uid(),day,section:0,pos:[0,0,0,0,0],sections:[choose('recognition'),choose('math'),shuffle([broad,driver,shuffle(ts.filter(t=>t!==broad&&t!==driver))[0]]),cases[day-1].steps.map((_,i)=>({kind:'case',day,index:i,id:'d'+day+'c'+i})),[]],drafts:{},done:[],completed:false,started:Date.now()};state.runs.push(r);state.active=r.id;state.practice=null;state.view='session';save();render();}
function draft(r,ref){const k=qkey(ref);if(!r.drafts[k])r.drafts[k]={stage:0,hints:0,values:{},checks:{}};return r.drafts[k];}
function activeRef(r){return r.practice?r.queue[r.index]:r.sections[r.section][r.pos[r.section]];}
function pct(r){const total=r.sections.slice(0,4).reduce((a,s)=>a+s.length,0)+2;return Math.round(r.done.length/total*100);}
function emit(r,ref,q,skill,value,answer,correct,why,category,self=false){const key=r.id+':'+qkey(ref)+':'+skill;if(state.events.some(e=>e.key===key))return;const d=draft(r,ref);state.events.push({key,run:r.id,day:r.day,qid:q.id,concept:q.c||skill,skill,value,self,hints:d.hints,time:Date.now()});if(value<1){state.mistakes.push({id:uid(),run:r.id,day:r.day,ref,question:q.text,answer,correct,why,trigger:q.trigger||'Match the question’s decision or outcome, then avoid overlap and support your conclusion.',category,skill,understood:false,self});}}
function options(items,name,d){return `<div class="options">${items.map((s,i)=>`<label class="option"><input type="radio" name="${name}" value="${i}" ${String(d.values[name])===String(i)?'checked':''}><span>${esc(s)}</span></label>`).join('')}</div>`;}
function choices(d,key,correct,wrong){if(!d[key])d[key]=shuffle([correct,...wrong.filter(x=>x!==correct).slice(0,3)]);return d[key];}
function form(inner,button='Submit'){return `<form id="answerForm">${inner}<p class="error" id="formError" role="alert"></p><button class="primary" type="submit">${button}</button></form>`;}
function tips(){return `<details><summary>Mental Math Tips</summary><p>10% = ÷10 · 5% = half of 10% · 20% = ÷5 · 25% = ÷4 · 50% = ÷2 · 75% = 50% + 25% · 15% = 10% + 5%</p><p>×1.5 = original + half. ÷40 = ÷4 then ÷10.<br>1.2M × 15% = 120K + 60K = 180K.</p><table><tr><td>Thousand (K)</td><td>1,000</td></tr><tr><td>Million (M)</td><td>1,000,000</td></tr><tr><td>Billion (B)</td><td>1,000,000,000</td></tr><tr><td>Percent → decimal</td><td>÷100: 8% = 0.08</td></tr><tr><td>Decimal → percent</td><td>×100: 0.25 = 25%</td></tr></table></details>`;}
function feedback(ok,text){return `<div class="feedback ${ok?'':'bad'}" role="status"><strong>${ok?'Correct':'Needs correction'}</strong>${text}</div>`;}
function next(){return '<button class="primary" data-act="next">Continue</button>';}
function render(){save();let html='';if(!storageOK)html+='<div class="notice">Browser storage is unavailable. Progress is only retained in this open page. Enable local storage for this file to save across visits.</div>';if(state.view==='dashboard')html+=dashboard();else if(state.view==='progress')html+=progress();else if(state.view==='mistakes')html+=mistakes();else html+=session();app.innerHTML=html;save();}

ction class="card"><div class="eyebrow">Daily workload</div><h2>Practice, without a timer.</h2><p>8 equation-recognition questions<br>8 business-math questions<br>3 structuring drills<br>1 sequential mini-case<br>Mistake review + 2 targeted redos</p><small>About 80–90 minutes at your own pace. Each repeat draws from 15 recognition scenarios, 15 math problems and 6 structures per day.</small></section></div><footer>Independent practice tool inspired by the supplied Capital One R1 preparation material. Not an official Capital One product. Data stays in this browser; keep the file at the same location.</footer><div class="actions"><button data-act="reset">Reset Progress</button></div>`;}
function progress(){const e=state.events,objs=objective(e),hints=allHints(),complete=new Set(state.runs.filter(r=>r.completed).map(r=>r.day));return `<div class="eyebrow">Performance history</div><h1>Overall progress</h1><p class="muted">Objective accuracy and self-assessment are separate. Repeats and targeted practice are included in history.</p><div class="stats"><div><b>${completedCount()}</b><span>Questions completed</span></div><div><b>${display(score(objs))}</b><span>Total objective accuracy</span></div><div><b>${hints}</b><span>Hint levels used</span></div><div><b>${state.mistakes.filter(m=>!m.understood).length}</b><span>Mistakes remaining</span></div><div><b>${complete.size}/5</b><span>Days completed</span></div></div><div class="grid"><section class="card wide"><h2>Skill profile</h2>${SKILLS.map(s=>metric(s+(['Structuring','Synthesis'].includes(s)?' · includes self-assessment':''),score(e,s))).join('')}<p class="muted">Mastery: ${display(mastery(e))}. Each hint level reduces a correct math question’s mastery by 15%, to a minimum of 55%. Accuracy itself is unchanged.</p></section><section class="card"><h2>Daily completion</h2>${DAYS.map((_,i)=>{let rs=state.runs.filter(r=>r.day===i+1),r=rs.at(-1);return metric('Day '+(i+1),rs.some(x=>x.completed)?100:r?Math.min(99,pct(r)):0);}).join('')}</section></div>${readiness()}<button class="primary" data-act="weak">Practice My Weak Areas</button>`;}
function allRuns(){return [...state.runs,...(state.practice?[state.practice]:[]),...(state.practices||[])];}

function session(){const r=current();if(!r){state.view='dashboard';return dashboard();}if(r.practice&&r.index>=r.queue.length)return `<section class="card"><h1>Targeted practice complete</h1><p>Results are saved in your progress history. Retry attempts do not erase the original mistake.</p><button class="primary" data-act="finishPractice">Back to dashboard</button></section>`;if(!r.practice&&r.section===4)return review(r);const ref=activeRef(r);if(!ref){r.section=Math.min(r.section+1,4);return session();}const q=resolve(ref),d=draft(r,ref);let sidebar=r.practice?'':`<aside class="sidebar"><p class="eyebrow">Day ${r.day}</p>${SECTIONS.map((s,i)=>`<button data-act="section" data-index="${i}" class="${r.section===i?'active':''}" ${i>0&&r.pos[i-1]<r.sections[i-1].length?'disabled':''}>${i+1}. ${s}${i<4?' · '+r.pos[i]+'/'+r.sections[i].length:''}</button>`).join('')}<p class="muted">Progress and drafts save automatically.</p></aside>`;let prefix=r.practice?'Targeted practice':`Day ${r.day} · ${SECTIONS[r.section]}`;let body=`<div class="eyebrow">${prefix}</div><h1>${r.practice?'Focus on the next step':DAYS[r.day-1]}</h1><p class="step">Question ${(r.practice?r.index:r.pos[r.section])+1} of ${r.practice?r.queue.length:r.sections[r.section].length}</p>`;if(q.case)body+=`<details ${q.index===0?'open':''}><summary>Case briefing · ${cases[r.day-1].title}</summary><p>${esc(cases[r.day-1].intro)}</p>${cases[r.day-1].steps.slice(0,q.index).map(s=>`<p>${esc(s.text)}</p>`).join('')}</details>`;body+=`<section class="card question"><div class="scenario">${esc(q.text)}</div>${questionUI(r,ref,q,d)}</section>`;return `<div class="workspace">${sidebar}<div>${body}</div></div>`;}
function questionUI(r,ref,q,d){if(q.kind==='recognition'){let concept=C[q.c][0],eq=equation(q);if(d.stage===0)return form('<h2>Which business concept is being tested?</h2>'+options(choices(d,'concepts',concept,shuffle(Object.values(C).map(c=>c[0]).filter(c=>c!==concept))),'concept',d),'Choose concept');if(d.stage===1)return form(`<p class="muted">Concept selected: ${esc(d.concepts[d.values.concept])}</p><h2>Which equation would you use?</h2><p>No calculation needed.</p>`+options(choices(d,'equations',eq,C[q.c][4]),'equation',d),'Check answer');return feedback(d.correct,`<p><b>Concept:</b> ${concept}</p><p><b>Equation:</b> ${esc(eq)}</p><p><b>Why:</b> ${esc(C[q.c][2])}</p><p><b>Trigger:</b> ${esc(q.trigger)}</p>`)+next();}
if(q.kind==='tree'||q.kind==='written')return writtenUI(q,d);
let hint=`<div class="actions"><button data-act="hint" ${d.hints>=3?'disabled':''}>Need a Hint? ${d.hints}/3</button></div>${d.hints?`<div class="feedback"><p>Hint 1 · ${C[q.c][0]}</p>${d.hints>=2?`<p>Hint 2 · ${esc(equation(q))}</p>`:''}${d.hints>=3?`<p>Hint 3 · Start by substituting: ${esc(q.first)}</p>`:''}</div>`:''}`;
let inner='';if(d.stage===0){let correct=q.setup;inner=form('<h2>Choose your setup first</h2>'+options(choices(d,'setups',correct,setupDistractors(q)),'setup',d),'Check setup');}
if(d.stage===1)inner=feedback(d.setupOK,`<p>Correct setup: <b>${esc(q.setup)}</b></p><p>${esc(C[q.c][2])}</p>`)+form(`<label class="field">Your numerical answer (${esc(q.unit)})<input autofocus type="text" inputmode="decimal" name="number" value="${esc(d.values.number||'')}" autocomplete="off"></label><small>Use the stated units. Commas, $, %, K and M are accepted. For a percent, enter 5 for 5%. Round non-integers to two decimals.</small>`,'Check calculation');

if(d.stage===3)inner=`<div class="feedback"><strong>Question review</strong><p>Setup: ${d.setupOK?'Correct':'Corrected'} · Arithmetic: ${d.numberOK?'Correct':'Incorrect'} · Interpretation: ${d.interpretOK?'Correct':'Needs correction'}</p><p><b>Equation:</b> ${esc(equation(q))}</p><p><b>Calculation:</b> ${esc(q.setup)} = ${fmt(q.answer)} ${esc(q.unit)}</p><p><b>Business meaning:</b> ${esc(q.meaning)}</p><p><b>Common mistake:</b> ${esc(q.common)}</p><p><b>Trigger:</b> ${esc(q.trigger)}</p><p><b>Mastery:</b> ${Math.round((Number(d.setupOK)+Number(d.numberOK)+Number(d.interpretOK))/3*(1-.15*d.hints)*100)}% · ${d.hints} hint levels used</p>${q.case?`<p><b>Your next step:</b> ${esc(d.values.nextstep)}</p><p class="muted">Compare your reasoning with the business meaning above; this written explanation is not automatically graded.</p>`:''}</div>${next()}`;
return inner+(d.stage<3?hint:'')+(d.stage>0||d.hints?tips():'');}
function equation(q){if(q.c==='breakeven'&&(q.text.includes('target profit')||q.text.includes('in addition')||q.text.includes('preserve')))return '(Fixed costs + Target profit) ÷ Contribution per unit';if(q.c==='contribution'&&q.text.includes('annual')&&q.text.includes('month'))return '(Monthly revenue − Monthly variable cost) × 12';return C[q.c][1];}
function interpretationDistractors(q){
const alternatives={
revenue:['This amount is profit available after all operating costs.','Sales alone establish that the product covers its fixed costs.','This amount measures the revenue generated by each individual customer.'],
profit:['This result is revenue before subtracting the listed expenses.','This result can be applied to future periods without rechecking volume or costs.','This result measures contribution before the fixed costs described in the question.'],
contribution:['This amount is total company profit after fixed costs.','Every dollar of revenue is available to pay fixed costs, regardless of variable costs.','This per-customer amount can be compared directly with total annual fixed costs without considering volume.'],
breakeven:['This volume delivers the target regardless of changes in unit costs or price.','At this threshold the business has recovered all future investments as well as the stated costs.','This threshold should be compared with the entire population, assuming everyone will buy.'],
conversion:['The rate uses only customers who completed the final stage as its denominator.','This conversion result by itself establishes that acquisition is profitable.','This rate can be applied to every stage of the funnel without checking the relevant starting pool.'],
cac:['This amount is the contribution earned from each acquired customer.','This amount is spending per person reached, including those who did not buy.','A lower value is always better even if acquired customers have much lower contribution.'],
change:['This result is the absolute percentage-point change between the two values.','The new value is the reference base for interpreting this change.','This change proves profit moved by the same percentage as the stated metric.'],
weighted:['Each segment should contribute equally to the average regardless of size.','This average is the value every individual customer or unit will generate.','The average will remain unchanged even if the segment mix shifts.'],
roi:['This percentage is an annual return even when the question uses multiple years.','This return ratio is also the number of years until investment is recovered.','This return already adjusts for timing, risk and the cost of capital.'],
payback:['This figure is the total net return as a percentage of the investment.','This period automatically includes the time value of money.','Recovering the initial outlay establishes that this is better than all alternatives.'],
probability:['Each individual trial will produce exactly the expected amount.','The most likely outcome alone should determine the expected value.','A positive expected value removes the need to evaluate downside risk.'],
market:['This estimate is guaranteed demand, so customer research is unnecessary.','The eligible segment and actual adopters are the same customer pool.','The full population should be treated as paying customers when planning capacity.'],
share:['This share proves that the company is the most profitable competitor.','Revenue share and unit share are interchangeable even when prices differ.','The ratio compares the company with its own prior year rather than the total market.'],
units:['The converted quantity can be compared with any period without further adjustment.','Converting the units changes the underlying scale of the business activity.','The result should be treated as profit even though no cost data was supplied.'],
funnel:['The purchase rate should be applied to all prospects, bypassing the response stage.','The two stage rates should be added to estimate total conversion.','The final customer count establishes profitability without campaign-cost data.'],
pricing:['A higher selling price always increases profit regardless of customer losses.','The revenue difference is sufficient even when variable costs change with volume.','Any positive new profit makes the change better than the current business.'],
acquisition:['This amount is total profit after every company fixed cost.','Acquisition cost should be ignored because the customers already generate contribution.','The result proves that future retention cannot affect the value of the cohort.']};
return alternatives[q.c];
}
function setupDistractors(q){let wrong=[];const n=q.setup.match(/\d[\d,]*(?:\.\d+)?/g)||[];if(n.length>=2)wrong.push(n[0]+' + '+n[1],n[0]+' ÷ '+n[1],n[0]+' × '+n[1]);wrong.push(...C[q.c][4]);return [...new Set(wrong)].filter(x=>x!==q.setup&&!equivalent(x,q.answer)).slice(0,3);}
function equivalent(s,answer){try{const e=s.replace(/,/g,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[\d.\s+*/()\-]+$/.test(e))return false;return Math.abs(Function('return ('+e+')')()-answer)<.00001;}catch{return false;}}
function writtenUI(q,d){const tree=q.kind==='tree';if(d.stage===0)return form(`${tree?'<h2>What kind of structure is requested?</h2>'+options(['Broad opening structure','Driver tree'],'type',d):''}${tree?[1,2,3,4].map(i=>`<label class="field">Bucket ${i}${i===4?' (optional)':''}<input type="text" name="bucket${i}" value="${esc(d.values['bucket'+i]||'')}"></label>`).join(''):`<label class="field">${q.skill==='Synthesis'?'Answer → 2 supporting reasons → key risk / next step':'Your structure (3–4 main areas)'}<textarea name="response">${esc(d.values.response||'')}</textarea></label>`}`,'Compare with model');let model=tree?`<ol>${q.model.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol>`:`<p>${esc(q.model)}</p>`;let yours=tree?[1,2,3,4].map(i=>d.values['bucket'+i]).filter(Boolean).join(' • '):d.values.response;return `${tree?feedback(d.typeOK,`<p>The interviewer asked for a <b>${q.type==='broad'?'broad opening structure':'driver tree'}</b>. ${q.type==='broad'?'Investigate the broad areas needed to make a decision.':'Break the specific outcome into its determining variables.'}</p>`):''}<div class="comparison"><div><h3>Your answer</h3><p style="white-space:pre-wrap">${esc(yours)}</p></div><div><h3>Model answer</h3>${model}</div></div><p class="muted">There is more than one valid structure. Compare the logic, not the wording. Written quality is self-assessed, not automatically judged.</p>${d.stage===1?form(`<div class="checks">${(q.skill==='Synthesis'?['Answers the actual decision','Uses two relevant pieces of evidence','Prioritizes key findings concisely','Names a meaningful risk and next step']:['Tailored to the question','Low overlap between branches','Covers major areas','Appropriate level of detail']).map((x,i)=>`<label><input type="checkbox" name="check${i}" ${d.values['check'+i]?'checked':''}> ${x}</label>`).join('')}</div><h3>Assess your answer</h3>${options(['Strong','Partially complete','Needs work'],'assessment',d)}`,'Save self-assessment'):`<div class="feedback">Saved self-assessment: <b>${['Strong','Partially complete','Needs work'][d.values.assessment]}</b></div>${next()}`}`;}

function weakSkills(e){return SKILLS.map(s=>({s,n:score(e,s)})).filter(x=>x.n!==null).sort((a,b)=>a.n-b.n);}
const coaching={
'Equation Recognition':['Selecting the relationship is the gateway to all later math.','Identify what is being requested: a total, a per-unit amount, a rate or a threshold.'],
'Math Setup':['An incorrect denominator or missing cost can reverse the business decision.','Write units beside each input; use contribution for breakeven and the original value for percent change.'],
'Arithmetic':['Calculation errors distort scale and thresholds even with the right setup.','Estimate first, break the calculation into simple steps and check units and signs.'],
'Business Interpretation':['A correct number must lead to a decision or next investigation.','Explain meaning, compare with a benchmark and identify the next assumption to validate.'],
'Structuring':['A useful structure directs analysis toward the actual decision.','Separate broad decision areas from variables in a driver tree; check overlap.'],
'Synthesis':['A recommendation must connect evidence with action.','Lead with the decision, give two reasons, then a material risk and validation step.']};
function buildRedos(r){if(r.redosBuilt)return;let ms=state.mistakes.filter(m=>m.run===r.id),unique=[...new Map(ms.map(m=>[qkey(m.ref),m.ref])).values()];let pick=shuffle(unique).slice(0,2);if(pick.length<2){let candidates=refs(r.day,'math').filter(x=>!pick.some(y=>y.id===x.id));pick.push(...shuffle(candidates).slice(0,2-pick.length));}r.redoRefs=pick;r.redosBuilt=true;}
function review(r){buildRedos(r);const e=records(r),weak=weakSkills(e).slice(0,2),ms=state.mistakes.filter(m=>m.run===r.id);let prev=state.runs.filter(x=>x.day<r.day&&x.completed).at(-1),improvement='This is your baseline session. Improvement over a prior day is not yet measurable.';if(prev){let diff=SKILLS.map(s=>({s,a:score(records(prev),s),b:score(e,s)})).filter(x=>x.a!==null&&x.b!==null).sort((a,b)=>(b.b-b.a)-(a.b-a.a));if(diff.length)improvement=diff[0].b>diff[0].a?`${diff[0].s} improved from ${diff[0].a}% to ${diff[0].b}% compared with your previous completed day.`:'No measured score increase over the previous completed day yet. Use today’s logged errors to guide the next session.';}
return `<div class="eyebrow">Day ${r.day} · Mistake review</div><h1>Today’s results</h1><div class="grid"><section class="card wide">${SKILLS.map(s=>metric(s+(['Structuring','Synthesis'].includes(s)?' · self-assessment included':''),score(e,s))).join('')}<p>Mini-case: <b>${r.pos[3]>=r.sections[3].length?'Completed':'Incomplete'}</b></p><p>Hint-adjusted mastery: ${display(mastery(e))}</p></section><section class="card"><h2>Top 2 focus areas</h2>${weak.map(x=>{let example=ms.find(m=>m.skill===x.s);return `<h3>${x.s} · ${display(x.n)}</h3><p>${example?esc(example.answer)+' → '+esc(example.correct):'No errors logged in this area; it is a relative focus based on available scores.'}</p><p>${coaching[x.s][0]}</p><small>${coaching[x.s][1]}</small>`;}).join('')}</section></div><section class="card"><h2>Patterns and next steps</h2><p><b>Improvement:</b> ${improvement}</p><p><b>Repeated patterns:</b> ${Object.entries(ms.reduce((a,m)=>(a[m.category]=(a[m.category]||0)+1,a),{})).filter(([,v])=>v>1).map(([k,v])=>esc(k)+' ('+v+' errors)').join('; ')||'No repeated mistake category observed.'}</p><p><b>Tomorrow’s priority:</b> ${weak.length?coaching[weak[0].s][1]:'Collect more performance evidence.'}</p><button data-act="mistakes">Review the error log</button></section>${r.day===5?readiness():''}<section class="card"><h2>Two targeted redo questions</h2><p>${ms.length?'Revisit missed skills from this session.':'No missed questions yet; use two reinforcement problems.'} Questions appear one at a time. Original results remain in your history.</p>${r.redosDone?'<p>Targeted redos completed.</p><button class="primary" data-act="complete">Complete day</button>':'<button class="primary" data-act="redos">Start targeted redos</button>'}</section>`;}
function readiness(){const e=state.events,day5=state.runs.some(r=>r.day===5&&r.pos[3]>=r.sections[3].length);if(!day5)return '';const ranked=Object.keys(C).map(c=>({s:C[c][0],n:score(objective(e).filter(x=>x.concept===c))})).filter(x=>x.n!==null).sort((a,b)=>b.n-a.n),skills=weakSkills(e),completeCases=new Set(state.runs.filter(r=>r.pos[3]>=r.sections[3].length).map(r=>r.day)).size;let math=score(objective(e).filter(x=>['Math Setup','Arithmetic'].includes(x.skill))),interp=score(e,'Business Interpretation'),self=score(e.filter(x=>x.self));let status=completeCases>=5&&math>=85&&interp>=85&&self>=70?'Yes':math>=70&&interp>=70?'Almost':'Not Yet';return `<section class="card"><h2>Ready for full cases? ${status}</h2><p>Based on ${completeCases}/5 completed mini-cases, math setup/arithmetic ${display(math)}, interpretation ${display(interp)}, and written self-assessment ${display(self)}. This is a practice indicator; written reasoning is not independently evaluated.</p><div class="comparison"><div><h3>Business math · strongest to weakest</h3><ol>${ranked.map(x=>`<li>${x.s}: ${x.n}%</li>`).join('')}</ol><small>Only assessed concepts are ranked.</small></div><div><h3>Case skills · strongest to weakest</h3><ol>${[...skills].reverse().map(x=>`<li>${x.s}: ${x.n}%</li>`).join('')}</ol><h3>Top 3 priorities</h3><ol>${skills.slice(0,3).map(x=>`<li><b>${x.s}:</b> ${coaching[x.s][1]}</li>`).join('')}</ol></div></div><small>Yes requires all five mini-cases, at least 85% math and interpretation, and 70% written self-assessment. Almost requires at least 70% math and interpretation; otherwise Not Yet.</small></section>`;}
function mistakes(){return `<div class="hero"><div><div class="eyebrow">Learn from each attempt</div><h1>Mistake review</h1><p class="muted">Original responses stay in your history. Marking a mistake understood does not change accuracy.</p></div><button class="primary" data-act="weak">Practice My Weak Areas</button></div>${state.mistakes.length?state.mistakes.map(m=>`<section class="card"><span class="pill">Day ${m.day} · ${esc(m.category)}${m.understood?' · Understood':''}</span><h2>${esc(m.question)}</h2><p><b>My answer:</b> ${esc(m.answer)}</p><p><b>Correct answer / model:</b> ${esc(m.correct)}</p><p><b>Why:</b> ${esc(m.why)}</p><p><b>Trigger to notice next time:</b> ${esc(m.trigger)}</p><label class="field">Category <select data-category="${m.id}" aria-label="Mistake category">${['Equation recognition','Arithmetic','Business interpretation','Issue-tree structure','Reading the question','Synthesis / recommendation'].map(c=>`<option ${c===m.category?'selected':''}>${c}</option>`).join('')}</select></label><small>You may reclassify a mistake as reading the question after reviewing the cause.</small><div class="actions"><button data-act="retry" data-id="${m.id}">Retry Question</button><button data-act="understood" data-id="${m.id}">Mark as Understood</button><button data-act="keep" data-id="${m.id}">Keep Practicing</button></div></section>`).join(''):'<div class="card empty">No mistakes logged yet. Start a day to build your performance history.</div>'}`;}
function practice(queue,parent=null){if(state.practice){state.practices=state.practices||[];state.practices.push(state.practice);}state.practice={id:uid(),practice:true,day:parent?parent.day:queue[0].day,queue,index:0,drafts:{},done:[],parent:parent?parent.id:null};state.view='session';save();render();}
function numeric(raw){let s=String(raw).trim().replace(/[$,%\s]/g,'');let mult=1;if(/[kmb]$/i.test(s)){mult={k:1e3,m:1e6,b:1e9}[s.slice(-1).toLowerCase()];s=s.slice(0,-1);}if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s))return NaN;return Number(s)*mult;}
function submit(){const r=current(),ref=activeRef(r),q=resolve(ref),d=draft(r,ref);const fail=s=>{document.getElementById('formError').textContent=s;};if(q.kind==='recognition'){if(d.stage===0){if(d.values.concept===undefined)return fail('Select a concept.');d.stage=1;}else{if(d.values.equation===undefined)return fail('Select an equation.');d.correct=d.concepts[d.values.concept]===C[q.c][0]&&d.equations[d.values.equation]===equation(q);emit(r,ref,q,'Equation Recognition',Number(d.correct),d.concepts[d.values.concept]+'; '+d.equations[d.values.equation],C[q.c][0]+'; '+equation(q),C[q.c][2],'Equation recognition');d.stage=2;}}
else if(q.kind==='tree'||q.kind==='written'){if(d.stage===0){if(q.kind==='tree'){if(d.values.type===undefined)return fail('Choose the type of structure.');if([1,2,3].some(i=>!(d.values['bucket'+i]||'').trim()))return fail('Provide at least three buckets.');d.typeOK=Number(d.values.type)===(q.type==='broad'?0:1);}else if(!(d.values.response||'').trim())return fail('Write your response before viewing the model.');d.stage=1;}else{if(d.values.assessment===undefined)return fail('Select your self-assessment.');let value=[1,.5,0][Number(d.values.assessment)];if(q.kind==='tree'&&!d.typeOK)value*=.75;emit(r,ref,q,q.skill||'Structuring',value,q.kind==='tree'?'Type: '+['Broad opening structure','Driver tree'][d.values.type]+'; '+[1,2,3,4].map(i=>d.values['bucket'+i]).filter(Boolean).join(' • '):d.values.response,Array.isArray(q.model)?q.model.join(' • '):q.model,'Self-assessment: '+['Strong','Partially complete','Needs work'][d.values.assessment]+(q.kind==='tree'?'; expected '+q.type+' structure.':'.'),q.skill==='Synthesis'?'Synthesis / recommendation':'Issue-tree structure',true);d.stage=2;}}
else if(d.stage===0){if(d.values.setup===undefined)return fail('Choose a setup.');d.setupOK=d.setups[d.values.setup]===q.setup;emit(r,ref,q,'Math Setup',Number(d.setupOK),d.setups[d.values.setup],q.setup,C[q.c][2],'Equation recognition');d.stage=1;}
else if(d.stage===1){const n=numeric(d.values.number);if(!Number.isFinite(n))return fail('Enter a valid number in the stated units.');d.numberOK=Math.abs(n-q.answer)<=.0051;emit(r,ref,q,'Arithmetic',Number(d.numberOK),d.values.number+' '+q.unit,fmt(q.answer)+' '+q.unit,q.setup+' = '+fmt(q.answer),'Arithmetic');d.stage=2;}
else if(d.stage===2){if(d.values.interpretation===undefined)return fail('Select an interpretation.');if(q.case&&!(d.values.nextstep||'').trim())return fail('Explain why the result matters and what you would investigate next.');d.interpretOK=d.interpretations[d.values.interpretation]===q.meaning;emit(r,ref,q,'Business Interpretation',Number(d.interpretOK),d.interpretations[d.values.interpretation],q.meaning,'Connect the result to a decision, benchmark or next investigation.','Business interpretation');d.stage=3;}
save();render();}
function advance(){const r=current(),ref=activeRef(r);if(!r.done.includes(qkey(ref)))r.done.push(qkey(ref));if(r.practice){r.index++;if(r.index>=r.queue.length&&r.parent){const parent=state.runs.find(x=>x.id===r.parent);parent.redosDone=true;state.practices=state.practices||[];state.practices.push(r);state.practice=null;state.active=parent.id;state.view='session';}}else{r.pos[r.section]++;if(r.pos[r.section]>=r.sections[r.section].length)r.section++;}save();render();}
document.addEventListener('submit',e=>{if(e.target.id==='answerForm'){e.preventDefault();submit();}});
document.addEventListener('input',e=>{if(e.target.closest('#answerForm')){const r=current(),ref=activeRef(r),d=draft(r,ref);d.values[e.target.name]=e.target.type==='checkbox'?e.target.checked:e.target.value;save();}});
document.addEventListener('change',e=>{if(e.target.dataset.category){state.mistakes.find(m=>m.id===e.target.dataset.category).category=e.target.value;save();}});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const a=b.dataset.act;if(['dashboard','progress','mistakes'].includes(a)){state.view=a;render();return;}if(a==='resumePractice'){if(!state.practice||state.practice.id!==b.dataset.id){stashPractice();const i=state.practices.findIndex(p=>p.id===b.dataset.id);state.practice=state.practices.splice(i,1)[0];}state.view='session';render();}
if(a==='start'){const day=+b.dataset.day,r=state.runs.filter(r=>r.day===day).at(-1);if(r&&!r.completed){stashPractice();state.active=r.id;state.view='session';render();}else makeRun(day);}
if(a==='section'){const r=run(),i=+b.dataset.index;if(i<4&&r.pos[i]>=r.sections[i].length){state.view='progress';render();}else{r.section=i;render();}}
if(a==='hint'){const r=current(),ref=activeRef(r),d=draft(r,ref);d.hints=Math.min(3,d.hints+1);state.events.filter(e=>e.run===r.id&&e.qid===resolve(ref).id).forEach(e=>e.hints=d.hints);render();}
if(a==='next')advance();
if(a==='complete'){const r=run();r.completed=true;state.view='dashboard';render();}
if(a==='redos'){let r=run();practice(r.redoRefs,r);}
if(a==='finishPractice'){state.practices=state.practices||[];state.practices.push(state.practice);state.practice=null;state.view='dashboard';render();}
if(a==='understood'||a==='keep'){state.mistakes.find(m=>m.id===b.dataset.id).understood=a==='understood';render();}
if(a==='retry'){let m=state.mistakes.find(m=>m.id===b.dataset.id);practice([m.ref]);}
if(a==='weak'){let weak=weakSkills(state.events).slice(0,2).map(x=>x.s),ms=state.mistakes.filter(m=>!m.understood&&weak.includes(m.skill));let pool=[...new Map(ms.map(m=>[qkey(m.ref),m.ref])).values()];if(pool.length<4){const cs=Object.keys(C).map(c=>({c,n:score(objective(state.events).filter(e=>e.concept===c))})).sort((a,b)=>(a.n??-1)-(b.n??-1)).slice(0,4).map(x=>x.c);pool.push(...shuffle(bank.flat().filter(q=>cs.includes(q.c))).slice(0,6-pool.length).map(q=>({kind:'math',day:q.day,id:q.id})));}practice(shuffle(pool).slice(0,6));}
if(a==='reset'&&confirm('Delete all saved progress, scores, drafts and mistakes? This cannot be undone.')){state=fresh();save();render();}
});
// Expose only read-only content integrity checks for local verification.
function validateBank(){let errors=[];for(let d=0;d<5;d++){if(bank[d].length<15||recognition[d].length<15||trees[d].length<6)errors.push('Insufficient bank day '+(d+1));}for(const q of [...bank.flat(),...cases.flatMap(c=>c.steps.filter(q=>q.kind==='math'))]){if(!Number.isFinite(q.answer)||!equivalent(q.setup,q.answer))errors.push('Calculation mismatch: '+q.text);if(setupDistractors(q).length!==3)errors.push('Missing alternatives: '+q.text);}return errors;}
if(validateBank().length)console.error(validateBank());
render();
</script></body></html>
